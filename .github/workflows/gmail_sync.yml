name: Gmail Finance Sync

on:
  schedule:
    # Tres veces al día, en hora Colombia (UTC-5 todo el año; el cron es UTC):
    #   12:40 pm → compras de la mañana     (17:40 UTC)
    #    6:40 pm → compras de la tarde      (23:40 UTC)
    #   10:40 pm → cierre del día           (03:40 UTC del día siguiente)
    # Minuto :40 y no :00/:30, donde se acumulan miles de workflows y GitHub
    # los retrasa más. Para correrlo ya: gh workflow run gmail_sync.yml
    - cron: '40 17,23,3 * * *'
  workflow_dispatch:

# Evita que dos ejecuciones se solapen (procesarían el mismo correo a la vez).
concurrency:
  group: gmail-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gmail sync
        run: python gmail_finanzas_sync.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_ADMIN_SDK_JSON: ${{ secrets.FIREBASE_ADMIN_SDK_JSON }}
